name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Extract version
        id: version
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "number=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.number }}"
          go build -ldflags "-X main.Version=$v" -o cybererp-print-agent.exe ./cmd/print-agent/
          Write-Host "Built $((Get-Item cybererp-print-agent.exe).Length) bytes"

      - name: SHA256
        id: sha256
        shell: pwsh
        run: |
          $hash = (Get-FileHash cybererp-print-agent.exe -Algorithm SHA256).Hash.ToUpper()
          echo "value=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "SHA256: $hash"

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.sha256.outputs.value }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          NOTES="## CyberPOS Print Agent ${TAG}"$'\n\n'"**SHA256:** \`${SHA}\`"
          gh release create "$TAG" cybererp-print-agent.exe \
            --title "Print Agent ${TAG}" \
            --notes "$NOTES"

      - name: Update VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          TAG: ${{ steps.version.outputs.tag }}
          VER: ${{ steps.version.outputs.number }}
          SHA: ${{ steps.sha256.outputs.value }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "VPS secrets not configured, skipping VPS update"
            exit 0
          fi
          echo "$VPS_SSH_KEY" > /tmp/vps_key
          chmod 600 /tmp/vps_key
          URL="https://github.com/${REPO}/releases/download/${TAG}/cybererp-print-agent.exe"
          ssh -i /tmp/vps_key -o StrictHostKeyChecking=no "${VPS_USER}@${VPS_HOST}" \
            "sed -i 's|PRINT_AGENT_VERSION=.*|PRINT_AGENT_VERSION=${VER}|' /opt/cyberpos/docker-compose.prod.yml && sed -i 's|PRINT_AGENT_SHA256=.*|PRINT_AGENT_SHA256=${SHA}|' /opt/cyberpos/docker-compose.prod.yml && sed -i 's|PRINT_AGENT_INSTALLER_URL=.*|PRINT_AGENT_INSTALLER_URL=${URL}|' /opt/cyberpos/docker-compose.prod.yml && cd /opt/cyberpos && docker-compose -f docker-compose.prod.yml up -d api-gateway"
          rm -f /tmp/vps_key
